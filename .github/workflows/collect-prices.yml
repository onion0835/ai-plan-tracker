name: Collect official plan prices

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-official-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test price extractors
        run: python -m unittest discover -s tests
      - name: Collect prices from official pages
        run: python scripts/collect_prices.py
      - name: Commit observation if changed
        run: |
          git add data/price-history/
          if git diff --cached --quiet; then
            echo 'No new observation to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: observe official plan prices"
          git push
